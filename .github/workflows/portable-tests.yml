name: Portable model and timing checks

on:
  push:
  pull_request:

jobs:
  portable:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Python and GCC versions
        run: python3 --version && gcc --version
      - name: Portable game timing regression
        run: python3 tests/run_game_timing.py
      - name: Version 8 model and transactional save validation
        run: python3 tests/run_tower50.py --label ci
      - name: Production fifty-floor route witnesses
        run: python3 tests/test_campaign_production.py
      - name: Actual input, dialogue paging, errands and checkpoint counts
        run: python3 tests/test_campaign_game.py
      - name: Hidden rooms, valve, quest and forged-save contracts
        run: python3 tools/test_campaign_contract.py
      - name: Restart confirmation and automatic edge paging
        run: |
          python3 tests/run_restart_menu.py
          python3 tests/run_camera_controls.py
      - name: Authored generated content and production glyph coverage
        run: |
          python3 tools/gen_campaign_dialogue.py --check
          python3 tools/gen_campaign_music.py --check
          python3 tests/test_ui_glyphs.py
      - name: Validated transactional preference storage
        run: python3 tests/run_preferences_storage.py
      - name: Portable soundtrack limits and deterministic rendering
        run: python3 tests/run_game_music.py
      - name: Audio hardware mute, wake and fault recovery
        run: python3 tests/run_audio_power.py
      - name: Read-only battery telemetry and charging states
        run: python3 tests/run_battery.py
      - name: Check out the workspace-pinned RGB565 engine for render tests
        uses: actions/checkout@v4
        with:
          repository: espressif2022/raylib-lite-engine
          ref: ca3200a6b7f63e2bdea07851e19fdbd3a42eb742
          path: test-deps/raylib-lite-engine
      - name: Apply required display ownership integration
        run: git -C test-deps/raylib-lite-engine apply "$GITHUB_WORKSPACE/tools/patches/raylib-lite-engine-settings-display.patch"
      - name: Install image validation dependency
        run: python3 -m pip install Pillow
      - name: Real bilingual text and modal bounds
        env:
          MOSAICO_ENGINE_ROOT: ${{ github.workspace }}/test-deps/raylib-lite-engine
        run: python3 tests/test_ui_layout.py
      - name: Complete production campaign through official Host ABI
        env:
          MOSAICO_ENGINE_ROOT: ${{ github.workspace }}/test-deps/raylib-lite-engine
        run: python3 tools/capture_campaign_host.py
      - name: Actual engine brightness transaction failure paths
        env:
          MOSAICO_ENGINE_ROOT: ${{ github.workspace }}/test-deps/raylib-lite-engine
        run: python3 tests/run_display_control.py
      - name: Real renderer idle and operation scheduling
        env:
          MOSAICO_ENGINE_ROOT: ${{ github.workspace }}/test-deps/raylib-lite-engine
        run: python3 tests/run_render_schedule.py
