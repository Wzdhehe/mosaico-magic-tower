name: Guarded-fork gameplay checks

on:
  push:
  pull_request:

jobs:
  strategy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Golden replay regeneration check
        run: |
          python3 tools/magic_tower_route.py
          git diff --exit-code -- tests/win_route.json tests/win_route.h
      - name: Four alternative winning routes
        run: |
          python3 -m unittest discover -s tests -p test_guarded_forks.py
          python3 tests/test_level_design.py
      - name: Portable C model replay
        run: python3 tests/run_tests.py --label guarded-forks
