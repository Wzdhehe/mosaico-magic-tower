name: Campaign route and economy checks

on:
  push:
  pull_request:

jobs:
  strategy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Authored campaign geometry and five production strategies
        run: python3 tests/test_campaign_production.py
      - name: Hidden rooms, optional rewards and transactional save contracts
        run: python3 tools/test_campaign_contract.py
      - name: Actual input, delivery pages and shared-price purchases
        run: python3 tests/test_campaign_game.py
      - name: Authored generated content and glyph coverage
        run: |
          python3 tools/gen_campaign_dialogue.py --check
          python3 tools/gen_campaign_music.py --check
          python3 tests/test_ui_glyphs.py
